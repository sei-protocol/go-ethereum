
name: Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  # Only cancel in-flight PR runs; every push to a protected branch should get its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read

env:
  # Matches build/checksums.txt's pinned Go toolchain (separate from the smoke workflow's version)
  GO_VERSION: '1.24.1'

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go run build/ci.go test -coverage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
